name: CI

on:
  pull_request:
  push:
    branches: [main, dev, "phase-2/**", "phase-3/**"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit --audit-level high

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up -d --wait
      - run: bash scripts/check-local-infrastructure.sh
      - run: pnpm --filter @nexus/database db:migrate
        env:
          DATABASE_URL: postgresql://nexus:nexus_local_only@localhost:5432/nexus
      - run: bash scripts/check-phase-one-database.sh
      - run: bash scripts/check-phase-one-auth.sh
      - run: bash scripts/check-phase-two-database.sh
      - run: bash scripts/check-phase-two-inspections.sh
      - run: bash scripts/check-phase-three-database.sh
      - run: bash scripts/check-phase-three-lifecycle.sh
      - if: failure()
        name: Report Phase 3 smoke failure
        run: |
          if [[ -f /tmp/phase-three-lifecycle-failure.txt ]]; then
            diagnostic=$(tr '\n' ';' </tmp/phase-three-lifecycle-failure.txt)
            echo "::error title=Phase 3 smoke diagnostics::$diagnostic"
          fi
      - if: failure()
        name: Report Phase 2 smoke failure
        run: |
          if [[ -f /tmp/phase-two-inspections-failure.txt ]]; then
            diagnostic=$(tr '\n' ';' </tmp/phase-two-inspections-failure.txt)
            echo "::error title=Phase 2 smoke diagnostics::$diagnostic"
          fi
      - if: failure()
        run: docker compose ps -a && docker compose logs --no-color
      - if: always()
        run: docker compose down -v
